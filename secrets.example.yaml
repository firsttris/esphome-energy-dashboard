# Kopieren nach secrets.yaml und eigene Werte eintragen:
#   cp secrets.example.yaml secrets.yaml
wifi_ssid: "Your_WiFi_Name"
wifi_password: "Your_WiFi_Password"
# 32 Byte, Base64-kodiert – erzeugen mit: openssl rand -base64 32
api_key: "REPLACE_WITH_OUTPUT_OF_openssl_rand_base64_32"
# Passwort für den Fallback-Hotspot (mind. 8 Zeichen)
fallback_password: "Your_Fallback_Password"
