# Netzwerk und Kommunikation

logger:
  # DEBUG würde jedes einzelne HA-Sensor-Update loggen
  level: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Fallback-Hotspot, falls das WLAN nicht erreichbar ist
  ap:
    ssid: "Energy-Dashboard Fallback"
    password: !secret fallback_password

captive_portal:

api:
  encryption:
    key: !secret api_key
  on_client_connected:
    - if:
        condition:
          lambda: 'return (0 == client_info.find("Home Assistant "));'
        then:
          - script.execute: on_ha_connected
  on_client_disconnected:
    - if:
        condition:
          lambda: 'return (0 == client_info.find("Home Assistant "));'
        then:
          - script.execute: on_ha_disconnected

ota:
  - platform: esphome
    on_begin:
      - light.turn_off:
          id: display_backlight
          transition_length: 0s
      - lambda: "id(display_backlight).loop();"
