name: Build firmware

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A new push to a pull request cancels its outdated run; runs on main finish
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Draft pull requests do not build; "Ready for review" starts the run
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESPHome
        run: pip install esphome

      - name: Create dummy secrets
        run: |
          cat > secrets.yaml <<EOS
          wifi_ssid: "ci"
          wifi_password: "ci-password"
          api_key: "$(openssl rand -base64 32)"
          fallback_password: "ci-password"
          EOS

      - name: Validate config
        run: esphome config main.yml > /dev/null

      - name: Compile
        run: esphome compile main.yml
