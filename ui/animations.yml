# Energiefluss-Animationen
#
# Gesteuert von der AKTUELLEN Leistung (W), nicht von den Tageszählern:
# ein Fluss läuft nur, solange wirklich Energie fließt, und je mehr Leistung,
# desto schneller. Gas und Wasser haben keinen Leistungssensor und laufen,
# solange ihr Tageszähler in den letzten 5 Minuten gestiegen ist.

interval:
  - interval: 40ms
    then:
      - if:
          condition:
            lambda: |-
              return lv_screen_active() == id(page_dashboard).obj &&
                     id(display_backlight).current_values.is_on();
          then:
            - lambda: |-
                using dashboard::Flow;
                using dashboard::value_or_zero;

                // Linienzüge der Segmente (Start -> Knick -> Ziel), siehe page_dashboard.yml
                static Flow pv_home{id(flow_pv), {{260, 130}, {260, 220}, {350, 220}}, 3};
                static Flow grid_home{id(flow_grid), {{130, 240}, {350, 240}}, 2};
                static Flow battery_home{id(flow_battery), {{260, 350}, {260, 260}, {350, 260}}, 3};
                static Flow grid_battery{id(flow_grid_battery), {{130, 260}, {220, 260}, {220, 350}}, 3};
                static Flow pv_grid{id(flow_pv_grid), {{220, 130}, {220, 220}, {130, 220}}, 3};
                static Flow pv_battery{id(flow_pv_battery), {{240, 130}, {240, 350}}, 2};
                static Flow gas_home{id(flow_gas), {{400, 130}, {400, 190}}, 2};
                static Flow water_home{id(flow_water), {{400, 350}, {400, 290}}, 2};
                static Flow home_heating{id(flow_home_heating), {{365, 205}, {335, 175}}, 2};

                const float threshold = ${flow_threshold_w};
                const float full = ${flow_full_speed_w};
                auto speed = [&](float watts) { return dashboard::flow_speed(watts, threshold, full); };

                // Ohne HA-Verbindung sind die Werte veraltet -> keine Animation
                bool online = id(ha_connected);
                float solar = online ? std::max(value_or_zero(id(current_solar_power)), 0.0f) : 0;
                float grid = online ? value_or_zero(id(current_grid_power)) : 0;         // + Bezug / - Einspeisung
                float battery = online ? value_or_zero(id(current_battery_power)) : 0;   // + Entladen / - Laden
                float heating = online ? value_or_zero(id(current_heating_rod_power)) : 0;

                float grid_import = std::max(grid, 0.0f);
                float feed_in = std::max(-grid, 0.0f);
                float discharge = std::max(battery, 0.0f);
                float charge = std::max(-battery, 0.0f);

                // Batterie wird aus PV geladen, soweit PV reicht - der Rest kommt aus dem Netz
                float pv_to_battery = std::min(charge, solar);
                float grid_to_battery = std::min(charge - pv_to_battery, grid_import);
                float pv_to_home = solar - feed_in - pv_to_battery;

                pv_home.step(speed(pv_to_home));
                grid_home.step(speed(grid_import - grid_to_battery));
                battery_home.step(speed(discharge));
                pv_grid.step(speed(feed_in));
                pv_battery.step(speed(pv_to_battery));
                grid_battery.step(speed(grid_to_battery));
                home_heating.step(speed(heating));
                gas_home.step(online && dashboard::gas_activity.active() ? 1.0f : 0.0f);
                water_home.step(online && dashboard::water_activity.active() ? 1.0f : 0.0f);
