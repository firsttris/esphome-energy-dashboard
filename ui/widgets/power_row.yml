# Zeile der Leistungstabelle: Bezeichnung links, Wert rechts
# Variablen: label, value_id, color
obj:
  width: 100%
  height: SIZE_CONTENT
  bg_opa: TRANSP
  radius: 0
  pad_all: 0
  pad_bottom: 14
  border_width: 2
  border_side: BOTTOM
  border_color: 0x333333
  scrollable: false
  layout:
    type: flex
    flex_flow: ROW
    flex_align_main: SPACE_BETWEEN
    flex_align_cross: CENTER
  widgets:
    - label:
        text: ${label}
        text_font: roboto_16
        text_color: ${color}
    - label:
        id: ${value_id}
        text: "-- W"
        text_font: roboto_16
        text_color: ${color}
