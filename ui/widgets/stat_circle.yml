# Kreis mit Icon, Tageswert und Einheit (PV, Gas, Wasser)
# Variablen: circle_id, x, y, color, icon, value_id, unit
obj:
  id: ${circle_id}
  x: ${x}
  y: ${y}
  width: 100
  height: 100
  bg_color: 0x0a0a0a
  border_color: ${color}
  border_width: 3
  radius: 50
  scrollbar_mode: "off"
  clickable: false
  widgets:
    - label:
        align: CENTER
        y: -15
        text: ${icon}
        text_font: icons_32
        text_color: ${color}

    - label:
        id: ${value_id}
        align: CENTER
        y: 10
        text: "--"
        text_font: roboto_16
        text_color: 0xFFFFFF

    - label:
        align: CENTER
        y: 28
        text: ${unit}
        text_font: roboto_12
        text_color: 0x888888
