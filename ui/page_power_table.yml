# Power Table Page - Aktuelle Leistungswerte

id: page_power_table
bg_color: 0x1a1a1a
widgets:
    # === Überschrift ===
    - label:
        align: TOP_MID
        y: 20
        text: "Aktuelle Leistung"
        text_font: roboto_24
        text_color: 0xFFFFFF

    # === Haupttabelle ===
    - obj:
        align: CENTER
        y: 20
        width: 400
        height: SIZE_CONTENT
        bg_color: 0x222222
        radius: 12
        border_width: 2
        border_color: 0x444444
        scrollbar_mode: "off"
        scrollable: false
        pad_all: 20
        layout:
          type: flex
          flex_flow: COLUMN
          pad_row: 14
        widgets:
          - !include { file: widgets/power_row.yml, vars: { label: "Hausverbrauch:", value_id: lbl_home_consumption, color: "0x00FF99" } }
          - !include { file: widgets/power_row.yml, vars: { label: "Netz:", value_id: lbl_grid_power, color: "0x00BBFF" } }
          - !include { file: widgets/power_row.yml, vars: { label: "PV Erzeugung:", value_id: lbl_pv_production, color: "0xFFBB33" } }
          - !include { file: widgets/power_row.yml, vars: { label: "PV Überschuss:", value_id: lbl_pv_surplus, color: "0xBB33FF" } }
          - !include { file: widgets/power_row.yml, vars: { label: "Batterie:", value_id: lbl_battery_power, color: "0xFF3399" } }
          - !include { file: widgets/power_row.yml, vars: { label: "Heizstab:", value_id: lbl_heating_rod, color: "0xFF5722" } }
