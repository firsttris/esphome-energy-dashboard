# Dashboard Page - Tageswerte und Energiefluss

id: page_dashboard
bg_color: 0x1a1a1a
widgets:
    # === UHRZEIT & DATUM (Links Oben) ===
    - obj:
        id: datetime_box
        x: 30
        y: 30
        width: 120
        height: 100
        bg_color: 0x0a0a0a
        border_width: 0
        radius: 0
        widgets:
          - label:
              id: time_label
              align: CENTER
              y: -10
              text: "--:--"
              text_font: roboto_24
              text_color: 0xFFFFFF
          - label:
              id: date_label
              align: CENTER
              y: 20
              text: "--.--."
              text_font: roboto_14
              text_color: 0x888888

    # === Energiefluss Linien (eckig/rechtwinklig) ===
    # PV -> Home (vertikal runter, dann horizontal rechts ins Haus)
    - !include { file: widgets/flow_line.yml, vars: { p1: "260, 120", p2: "260, 222", color: "0x332211" } }
    - !include { file: widgets/flow_line.yml, vars: { p1: "260, 220", p2: "360, 220", color: "0x332211" } }
    # Netz -> Home (horizontal)
    - !include { file: widgets/flow_line.yml, vars: { p1: "130, 240", p2: "350, 240", color: "0x223344" } }
    # Batterie -> Home (vertikal hoch, dann horizontal rechts ins Haus)
    - !include { file: widgets/flow_line.yml, vars: { p1: "260, 360", p2: "260, 259", color: "0x44112B" } }
    - !include { file: widgets/flow_line.yml, vars: { p1: "260, 260", p2: "360, 260", color: "0x44112B" } }
    # Netz -> Batterie (horizontal rechts, dann vertikal runter)
    - !include { file: widgets/flow_line.yml, vars: { p1: "120, 260", p2: "222, 260", color: "0x444444" } }
    - !include { file: widgets/flow_line.yml, vars: { p1: "220, 260", p2: "220, 360", color: "0x444444" } }
    # PV -> Netz (vertikal runter, dann horizontal links)
    - !include { file: widgets/flow_line.yml, vars: { p1: "120, 220", p2: "222, 220", color: "0x332244" } }
    - !include { file: widgets/flow_line.yml, vars: { p1: "220, 220", p2: "220, 120", color: "0x332244" } }
    # PV -> Batterie (vertikal mittig)
    - !include { file: widgets/flow_line.yml, vars: { p1: "240, 130", p2: "240, 350", color: "0x332233" } }
    # Gas -> Home (vertikal nach unten)
    - !include { file: widgets/flow_line.yml, vars: { p1: "400, 130", p2: "400, 190", color: "0x332211" } }
    # Wasser -> Home (vertikal nach oben)
    - !include { file: widgets/flow_line.yml, vars: { p1: "400, 350", p2: "400, 290", color: "0x223344" } }
    # Home -> Heizstab (diagonal)
    - !include { file: widgets/flow_line.yml, vars: { p1: "365, 205", p2: "348, 188", color: "0x552200" } }

    # === Animierte Energiefluss Segmente ===
    # Liegen unter den Kreisen, damit sie an den Knoten "eintauchen"
    - !include { file: widgets/flow_segment.yml, vars: { flow_id: flow_pv, color: "0xFFBB33" } }
    - !include { file: widgets/flow_segment.yml, vars: { flow_id: flow_grid, color: "0x00BBFF" } }
    - !include { file: widgets/flow_segment.yml, vars: { flow_id: flow_battery, color: "0xFF3399" } }
    - !include { file: widgets/flow_segment.yml, vars: { flow_id: flow_gas, color: "0xFF6666" } }
    - !include { file: widgets/flow_segment.yml, vars: { flow_id: flow_water, color: "0x00DDFF" } }
    - !include { file: widgets/flow_segment.yml, vars: { flow_id: flow_grid_battery, color: "0xFFFFFF" } }
    - !include { file: widgets/flow_segment.yml, vars: { flow_id: flow_pv_grid, color: "0xBB33FF" } }
    - !include { file: widgets/flow_segment.yml, vars: { flow_id: flow_pv_battery, color: "0xFF3399" } }
    - !include { file: widgets/flow_segment.yml, vars: { flow_id: flow_home_heating, color: "0xFF5722" } }

    # === PV (Oben Mitte) ===
    - !include
        file: widgets/stat_circle.yml
        vars: { circle_id: pv_circle, x: "190", y: "30", color: "0xFFBB33", icon: "\U000F0A72", value_id: pv_value, unit: "kWh" }

    # === NETZ (Links) ===
    - obj:
        id: grid_circle
        x: 30
        y: 190
        width: 100
        height: 100
        bg_color: 0x0a0a0a
        border_color: 0x00BBFF
        border_width: 3
        radius: 50
        scrollbar_mode: "off"
        clickable: false
        widgets:
          - label:
              align: CENTER
              y: -15
              text: "\U000F0D3E"
              text_font: icons_32
              text_color: 0x00BBFF

          # Bezug mit Pfeil rechts
          - label:
              align: CENTER
              y: 10
              x: -28
              text: "\U000F0054"
              text_font: icons_16
              text_color: 0x00BBFF

          - label:
              id: grid_bezug_label
              align: CENTER
              y: 10
              x: 5
              text: "--"
              text_font: roboto_12
              text_color: 0x00BBFF
              text_align: RIGHT

          # Einspeisung mit Pfeil links
          - label:
              align: CENTER
              y: 25
              x: -28
              text: "\U000F004D"
              text_font: icons_16
              text_color: 0xBB33FF

          - label:
              id: grid_einspeisung_label
              align: CENTER
              y: 25
              x: 5
              text: "--"
              text_font: roboto_12
              text_color: 0xBB33FF
              text_align: RIGHT

    # === HEIZSTAB (Oben Rechts) ===
    - obj:
        id: heating_rod_circle
        x: 280
        y: 120
        width: 80
        height: 80
        bg_color: 0x0a0a0a
        border_color: 0xFF5722
        border_width: 3
        radius: 40
        scrollbar_mode: "off"
        clickable: false
        widgets:
          - label:
              align: CENTER
              y: -8
              text: "\U000F0F92"
              text_font: icons_32
              text_color: 0xFF5722

          - label:
              id: heating_rod_value
              align: CENTER
              y: 15
              text: "--"
              text_font: roboto_14
              text_color: 0xFFFFFF

          - label:
              align: CENTER
              y: 30
              text: "kWh"
              text_font: roboto_12
              text_color: 0x888888

    # === HOME (Rechts Mitte) ===
    # Der Ring zeigt, woher der Tagesverbrauch stammt: PV (gelb), Batterie (pink), Netz (blau)
    - obj:
        id: home_circle
        x: 350
        y: 190
        width: 100
        height: 100
        bg_color: 0x0a0a0a
        border_color: 0x00FF99
        border_width: 3
        radius: 50
        scrollbar_mode: "off"
        clickable: false
        widgets:
          - arc:
              id: home_arc_pv
              align: CENTER
              width: 94
              height: 94
              start_angle: 0
              end_angle: 0
              rotation: 270
              value: 100
              min_value: 0
              max_value: 100
              arc_width: 3
              arc_color: 0x0a0a0a
              arc_opa: 0
              arc_rounded: false
              hidden: true
              indicator:
                arc_color: 0xFFBB33
                arc_width: 3
                arc_rounded: false

          - arc:
              id: home_arc_battery
              align: CENTER
              width: 94
              height: 94
              start_angle: 0
              end_angle: 0
              rotation: 270
              value: 100
              min_value: 0
              max_value: 100
              arc_width: 3
              arc_color: 0x0a0a0a
              arc_opa: 0
              arc_rounded: false
              hidden: true
              indicator:
                arc_color: 0xFF3399
                arc_width: 3
                arc_rounded: false

          - arc:
              id: home_arc_grid
              align: CENTER
              width: 94
              height: 94
              start_angle: 0
              end_angle: 0
              rotation: 270
              value: 100
              min_value: 0
              max_value: 100
              arc_width: 3
              arc_color: 0x0a0a0a
              arc_opa: 0
              arc_rounded: false
              hidden: true
              indicator:
                arc_color: 0x00BBFF
                arc_width: 3
                arc_rounded: false

          - label:
              align: CENTER
              y: -15
              text: "\U000F02DC"
              text_font: icons_32
              text_color: 0x00FF99

          - label:
              id: home_value
              align: CENTER
              y: 10
              text: "--"
              text_font: roboto_16
              text_color: 0xFFFFFF

          - label:
              align: CENTER
              y: 28
              text: "kWh"
              text_font: roboto_12
              text_color: 0x888888

    # === BATTERIE (Unten Mitte) ===
    - obj:
        id: battery_circle
        x: 190
        y: 350
        width: 100
        height: 100
        bg_color: 0x0a0a0a
        border_width: 0
        radius: 50
        scrollbar_mode: "off"
        clickable: false
        widgets:
          # Fortschrittskreis für Batterie-Ladezustand
          - arc:
              id: battery_arc
              align: CENTER
              width: 100
              height: 100
              start_angle: 135
              end_angle: 45
              rotation: 0
              value: 0
              min_value: 0
              max_value: 100
              arc_width: 6
              arc_color: 0x1a1a1a
              arc_rounded: true
              indicator:
                arc_color: 0xFF3399
                arc_width: 6
                arc_rounded: true

          # Prozent-Label (oben)
          - label:
              id: battery_soc_label
              align: CENTER
              y: -30
              text: "--%"
              text_font: roboto_14
              text_color: 0xFFFFFF

          # Batterie Icon (Mitte)
          - label:
              align: CENTER
              y: 0
              text: "\U000F12A3"
              text_font: icons_32
              text_color: 0xFF3399

          # Ladung mit Pfeil runter
          - label:
              align: CENTER
              y: 23
              x: -25
              text: "\U000F0045"
              text_font: icons_16
              text_color: 0xFF3399

          - label:
              id: battery_charge_label
              align: CENTER
              y: 23
              x: 8
              text: "--"
              text_font: roboto_12
              text_color: 0xFF3399

          # Entladung mit Pfeil hoch
          - label:
              align: CENTER
              y: 38
              x: -25
              text: "\U000F005D"
              text_font: icons_16
              text_color: 0xFF80BF

          - label:
              id: battery_discharge_label
              align: CENTER
              y: 38
              x: 8
              text: "--"
              text_font: roboto_12
              text_color: 0xFF80BF

    # === GAS (Rechts Oben) ===
    - !include
        file: widgets/stat_circle.yml
        vars: { circle_id: gas_circle, x: "350", y: "30", color: "0xFF6666", icon: "\U000F0238", value_id: gas_value, unit: "m³" }

    # === WASSER (Rechts Unten) ===
    - !include
        file: widgets/stat_circle.yml
        vars: { circle_id: water_circle, x: "350", y: "350", color: "0x00DDFF", icon: "\U000F058C", value_id: water_value, unit: "m³" }
