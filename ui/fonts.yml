# Font Definitionen

font:
  - file: "gfonts://Roboto"
    id: roboto_12
    size: 12
    glyphs: &latin_glyphs " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~°²³ÄÖÜäöüß"

  - file: "gfonts://Roboto"
    id: roboto_14
    size: 14
    glyphs: *latin_glyphs

  - file: "gfonts://Roboto"
    id: roboto_16
    size: 16
    glyphs: *latin_glyphs

  - file: "gfonts://Roboto"
    id: roboto_24
    size: 24
    glyphs: *latin_glyphs

  - file: "fonts/materialdesignicons-webfont.ttf"
    id: icons_32
    size: 32
    glyphs: [
      "\U000F0A72",  # solar-power
      "\U000F02DC",  # home
      "\U000F12A3",  # battery-high
      "\U000F0238",  # fire (Gas)
      "\U000F058C",  # water
      "\U000F0F92",  # water-boiler (Heizstab)
      "\U000F0D3E",  # transmission-tower (Netz)
    ]

  - file: "fonts/materialdesignicons-webfont.ttf"
    id: icons_16
    size: 16
    glyphs: [
      "\U000F0045",  # arrow-down
      "\U000F005D",  # arrow-up
      "\U000F0054",  # arrow-right
      "\U000F004D",  # arrow-left
      "\U000F0164",  # cloud-off-outline (Offline-Hinweis)
    ]
