# Schriften: Barlow Semi Condensed (schmal, gut lesbare Ziffern) und MDI-Symbole

font:
  - file: { type: gfonts, family: Barlow Semi Condensed, weight: 600 }
    id: font_32b
    size: 32
    glyphs: &digits " +,-.0123456789:%WkM−"

  - file: { type: gfonts, family: Barlow Semi Condensed, weight: 700 }
    id: font_24b
    size: 24
    glyphs: &latin " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~°²³ÄÖÜäöüß€·–−"

  - file: { type: gfonts, family: Barlow Semi Condensed, weight: 600 }
    id: font_20b
    size: 20
    glyphs: *latin

  - file: { type: gfonts, family: Barlow Semi Condensed, weight: 500 }
    id: font_14
    size: 14
    glyphs: *latin

  - file: { type: gfonts, family: Barlow Semi Condensed, weight: 500 }
    id: font_12
    size: 12
    glyphs: *latin

  - file: { type: gfonts, family: Barlow Semi Condensed, weight: 600 }
    id: font_10b
    size: 10
    glyphs: *latin

  - file: "fonts/materialdesignicons-webfont.ttf"
    id: icons_32
    size: 32
    glyphs: [
      "\U000F0A72",  # solar-power (Ladebildschirm)
    ]

  - file: "fonts/materialdesignicons-webfont.ttf"
    id: icons_20
    size: 20
    glyphs: [
      "\U000F0238",  # fire (Gas)
      "\U000F058C",  # water
      "\U000F0D3E",  # transmission-tower (Netz)
    ]

  - file: "fonts/materialdesignicons-webfont.ttf"
    id: icons_16
    size: 16
    glyphs: [
      "\U000F0045",  # arrow-down (Bezug)
      "\U000F005D",  # arrow-up (Einspeisung)
      "\U000F0164",  # cloud-off-outline (Offline-Hinweis)
    ]
