# Verknüpft die Home-Assistant-Sensoren mit der Anzeige (ui/scene.h liest dash::in).

sensor:
  - id: !extend current_solar_power
    on_value: [lambda: "dash::in.pv = x;"]
  - id: !extend current_grid_power
    on_value: [lambda: "dash::in.grid = x;"]
  - id: !extend current_battery_power
    on_value: [lambda: "dash::in.bat = x;"]
  - id: !extend current_home_consumption
    on_value: [lambda: "dash::in.home = x;"]
  - id: !extend current_heating_rod_power
    on_value: [lambda: "dash::in.rod = x;"]
  - id: !extend battery_soc
    on_value: [lambda: "dash::in.soc = x;"]
  - id: !extend boiler_temperature
    on_value: [lambda: "dash::in.boiler_temp = x;"]

  - id: !extend solar_power
    on_value: [lambda: "dash::in.pv_day = x;"]
  - id: !extend solar_power_2
    # Zweiter Wechselrichter ist nachts oft nicht erreichbar: letzten Wert halten
    on_value: [lambda: "if (!std::isnan(x)) dash::in.hoy_day = x;"]
  - id: !extend grid_power
    on_value: [lambda: "dash::in.import_day = x;"]
  - id: !extend grid_feed_in
    on_value: [lambda: "dash::in.export_day = x;"]
  - id: !extend home_power
    on_value: [lambda: "dash::in.home_day = x;"]
  - id: !extend battery_charge
    on_value: [lambda: "dash::in.charge_day = x;"]
  - id: !extend battery_discharge
    on_value: [lambda: "dash::in.discharge_day = x;"]
  - id: !extend heating_rod_daily_energy
    on_value: [lambda: "dash::in.rod_day = x;"]
  - id: !extend gas_power
    on_value:
      - lambda: |-
          dashboard::gas_activity.feed(x);
          dash::in.gas_day = x;
  - id: !extend water_power
    on_value:
      - lambda: |-
          dashboard::water_activity.feed(x);
          dash::in.water_day = x;
  - id: !extend pv_forecast_today
    on_value: [lambda: "dash::in.forecast_today = x;"]
  - id: !extend pv_forecast_tomorrow
    on_value: [lambda: "dash::in.forecast_tomorrow = x;"]

text_sensor:
  - id: !extend sun_next_rising
    on_value: [lambda: "dash::in.next_rising = x;"]
  - id: !extend sun_next_setting
    on_value: [lambda: "dash::in.next_setting = x;"]

time:
  - id: !extend ha_time
    on_time:
      # Gehaltenen Tageswert des zweiten Wechselrichters um Mitternacht zurücksetzen
      - seconds: 0
        minutes: 0
        hours: 0
        then:
          - lambda: "dash::in.hoy_day = 0;"
