# Home Assistant Sensoren und Zeit
#
# Hier nur die entity_ids an die eigene Installation anpassen.
# Welche Anzeige welcher Sensor füttert, steht in ui/bindings.yml.

sensor:
  # Tageswerte (kWh bzw. m³, täglich zurückgesetzte Utility-Meter)
  - platform: homeassistant
    id: solar_power
    entity_id: sensor.deye_wechselrichter_deye_tagliche_produktion
    internal: true

  # Zweiter Wechselrichter (optional, z. B. Hoymiles über OpenDTU); wird zu PV addiert
  - platform: homeassistant
    id: solar_power_2
    entity_id: sensor.hoymiles_tagesertrag
    internal: true

  - platform: homeassistant
    id: grid_power
    entity_id: sensor.deye_wechselrichter_deye_taglich_energie_bezogen
    internal: true

  - platform: homeassistant
    id: grid_feed_in
    entity_id: sensor.deye_wechselrichter_deye_taglich_energie_eingespiesen
    internal: true

  - platform: homeassistant
    id: home_power
    entity_id: sensor.strom_tagesverbrauch
    internal: true

  - platform: homeassistant
    id: battery_soc
    entity_id: sensor.deye_wechselrichter_deye_batterie_soc
    internal: true

  - platform: homeassistant
    id: battery_charge
    entity_id: sensor.deye_wechselrichter_deye_tagliche_batterie_ladung
    internal: true

  - platform: homeassistant
    id: battery_discharge
    entity_id: sensor.deye_wechselrichter_deye_tagliche_batterie_entladung
    internal: true

  - platform: homeassistant
    id: gas_power
    entity_id: sensor.gas_tagesverbrauch
    internal: true

  - platform: homeassistant
    id: water_power
    entity_id: sensor.wasser_tagesverbrauch
    internal: true

  - platform: homeassistant
    id: heating_rod_daily_energy
    entity_id: sensor.ac_elwa_2_energy_consumption_daily
    internal: true

  # PV-Prognose (kWh), z. B. Forecast.Solar
  - platform: homeassistant
    id: pv_forecast_today
    entity_id: sensor.pv_prognose_heute
    internal: true

  - platform: homeassistant
    id: pv_forecast_tomorrow
    entity_id: sensor.pv_prognose_morgen
    internal: true

  # Warmwasser-Temperatur (°C) für den Heizstab-Knoten
  - platform: homeassistant
    id: boiler_temperature
    entity_id: sensor.ac_elwa_2_temperatur_1
    internal: true

  # Aktuelle Leistungswerte (W) - steuern die Fluss-Animationen
  - platform: homeassistant
    id: current_home_consumption
    entity_id: sensor.hausverbrauch
    internal: true

  - platform: homeassistant
    id: current_grid_power
    # Positiv = Netzbezug, negativ = Einspeisung
    entity_id: sensor.deye_wechselrichter_deye_netz_gesamtleistung
    internal: true

  - platform: homeassistant
    id: current_solar_power
    entity_id: sensor.aktuelle_pv_leistung
    internal: true

  - platform: homeassistant
    id: current_heating_rod_power
    entity_id: sensor.ac_elwa_2_power_elwa_2
    internal: true

  - platform: homeassistant
    id: current_battery_power
    # Positiv = Entladen, negativ = Laden
    entity_id: sensor.deye_wechselrichter_deye_batterie_leistung
    internal: true

# Sonnenauf- und -untergang für den Sonnenbogen
text_sensor:
  - platform: homeassistant
    id: sun_next_rising
    entity_id: sun.sun
    attribute: next_rising
    internal: true

  - platform: homeassistant
    id: sun_next_setting
    entity_id: sun.sun
    attribute: next_setting
    internal: true

# Zeit von Home Assistant
time:
  - platform: homeassistant
    id: ha_time
