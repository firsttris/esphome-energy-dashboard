# Energie Dashboard - Hauptkonfiguration
# Modulare Struktur für bessere Wartbarkeit

substitutions:
  # Ab welcher Leistung (W) ein Energiefluss animiert wird
  flow_threshold_w: "20"
  # Leistung (W), bei der die Fluss-Animation ihre Höchstgeschwindigkeit erreicht
  flow_full_speed_w: "5000"
  # Nutzbare Akkukapazität (kWh) und Mindest-Ladestand (%) für "voll um" / "reicht bis"
  battery_capacity_kwh: "9.0"
  battery_reserve_soc: "20"
  # Strompreise (€/kWh) für "heute gespart": Bezug und Einspeisevergütung
  price_import: "0.2957"
  price_export: "0.0786"
  # FPS-Anzeige unten links (fps · ms pro Bild · Anteil neu gezeichnet)
  show_fps: "true"

esphome:
  name: "energy-dashboard"
  friendly_name: "Energie Dashboard"
  includes:
    - ui/dashboard.h
    - ui/scene.h
  build_flags:
    # Mehr Platz für einzelne neu zu zeichnende Bereiche. Mit dem Standard (32)
    # zeichnet LVGL bei vielen kleinen bewegten Objekten den ganzen Bildschirm neu.
    - -DLV_INV_BUF_SIZE=128

packages:
  hardware: !include base/hardware.yml
  network: !include base/network.yml
  backlight: !include base/backlight.yml
  ha_sensors: !include sensors/homeassistant.yml
  ui_fonts: !include ui/fonts.yml
  ui_images: !include ui/images.yml
  ui_loading: !include ui/loading.yml
  ui_layout: !include ui/layout.yml
  ui_bindings: !include ui/bindings.yml
